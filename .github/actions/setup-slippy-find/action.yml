name: 'Setup slippy-find'
description: 'Install the slippy-find CLI from GitHub Releases'
branding:
  icon: 'download'
  color: 'blue'

inputs:
  version:
    description: 'Version to install (e.g., v0.2.0). Use "latest" for the most recent release.'
    required: false
    default: 'latest'

runs:
  using: 'composite'
  steps:
    - name: Determine platform
      id: platform
      shell: bash
      run: |
        OS=$(uname -s | tr '[:upper:]' '[:lower:]')
        ARCH=$(uname -m)
        
        # Map architecture names
        case "$ARCH" in
          x86_64)  ARCH="amd64" ;;
          aarch64) ARCH="arm64" ;;
          arm64)   ARCH="arm64" ;;
        esac
        
        # Build binary name
        if [ "$OS" = "windows" ]; then
          BINARY="slippy-find-${OS}-${ARCH}.exe"
        else
          BINARY="slippy-find-${OS}-${ARCH}"
        fi
        
        echo "os=$OS" >> "$GITHUB_OUTPUT"
        echo "arch=$ARCH" >> "$GITHUB_OUTPUT"
        echo "binary=$BINARY" >> "$GITHUB_OUTPUT"

    - name: Download slippy-find
      shell: bash
      run: |
        VERSION="${{ inputs.version }}"
        BINARY="${{ steps.platform.outputs.binary }}"
        
        if [ "$VERSION" = "latest" ]; then
          BASE_URL="https://github.com/MyCarrier-DevOps/slippy-find/releases/latest/download"
        else
          BASE_URL="https://github.com/MyCarrier-DevOps/slippy-find/releases/download/${VERSION}"
        fi
        URL="${BASE_URL}/${BINARY}"
        SUMS_URL="${BASE_URL}/checksums.txt"
        
        echo "Downloading slippy-find from: $URL"
        curl -sL --fail "$URL" -o slippy-find || {
          echo "::error::Failed to download slippy-find from $URL"
          exit 1
        }
        
        # Verify the binary against the checksums.txt the release job publishes beside it.
        # Fail closed: a missing checksums.txt, no single well-formed entry for this binary,
        # or a mismatch removes the download and fails the step. The hash is validated here
        # because macOS's sha256sum -c only warns, and exits 0, on a malformed line.
        SUMS=$(curl -sL --fail "$SUMS_URL") || {
          rm -f slippy-find
          echo "::error::Failed to download checksums from $SUMS_URL"
          exit 1
        }
        EXPECTED=$(printf '%s\n' "$SUMS" | awk -v f="$BINARY" '$2 == f { n++; h = $1 } END { if (n == 1) print h }')
        if ! [[ "$EXPECTED" =~ ^[0-9a-f]{64}$ ]]; then
          rm -f slippy-find
          echo "::error::$SUMS_URL has no single well-formed SHA-256 entry for $BINARY"
          exit 1
        fi
        if command -v sha256sum >/dev/null 2>&1; then
          SHA256_CHECK=(sha256sum -c -)
        else
          SHA256_CHECK=(shasum -a 256 -c -)
        fi
        if ! printf '%s  %s\n' "$EXPECTED" slippy-find | "${SHA256_CHECK[@]}"; then
          rm -f slippy-find
          echo "::error::slippy-find does not match the SHA-256 of $BINARY in $SUMS_URL"
          exit 1
        fi
        
        chmod +x slippy-find

    - name: Install slippy-find
      shell: bash
      run: |
        if [ "${{ steps.platform.outputs.os }}" = "windows" ]; then
          mkdir -p "$HOME/bin"
          mv slippy-find "$HOME/bin/slippy-find.exe"
          echo "$HOME/bin" >> "$GITHUB_PATH"
        else
          sudo mv slippy-find /usr/local/bin/
        fi

    - name: Verify installation
      shell: bash
      run: |
        slippy-find --version
        echo "✓ slippy-find installed successfully"
